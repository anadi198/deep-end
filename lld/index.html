<title>LLD Lab</title>
<meta name="description" content="Low-level design and design patterns for Java interviews, in short steps. Lessons that lead with the one thing to remember, exercises graded by a real Java compiler in your browser, Claude reviews of your designs, and a 5-minute daily review.">
<meta property="og:type" content="website">
<meta property="og:title" content="LLD Lab: low-level design, one pattern at a time">
<meta property="og:description" content="Design patterns and LLD case studies in Java: short lessons, auto-graded exercises in your browser, Claude design reviews, spaced review.">
<meta property="og:url" content="https://anadi198.github.io/lld/">
<meta name="twitter:card" content="summary">

<body>
<div class="app" id="app" data-tab="read" data-view="home">
  <header class="topbar">
    <button class="btn quiet icon-btn" id="navToggle" aria-label="Show or hide the course outline" title="Show or hide the course outline">☰</button>
    <a class="btn quiet icon-btn home-btn" href="../" title="All labs" aria-label="All labs"><svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg></a>
    <a class="brand" href="#/" title="Home"><b>LLD<span>Lab</span></b><small>low-level design, one pattern at a time</small></a>
    <div class="spacer"></div>
    <button class="chip due" id="todayChip" title="Cards due in today's 5-minute review" hidden></button>
    <button class="chip sync" id="syncChip" hidden></button>
    <div class="chip progress-chip" id="progressChip" title="Steps done"></div>
    <button class="btn quiet icon-btn" id="focusBtn" aria-label="Focus mode">◎</button>
    <button class="btn quiet icon-btn" id="themeBtn" title="Toggle light/dark" aria-label="Toggle light or dark theme">◐</button>
    <button class="btn quiet icon-btn" id="menuBtn" title="More" aria-label="More options">⋯</button>
  </header>

  <nav class="nav" id="nav" aria-label="Course outline"></nav>

  <div class="tabs" role="tablist">
    <button id="tabRead" class="on" role="tab">Task</button>
    <button id="tabCode" role="tab">Code</button>
  </div>

  <main class="reader-pane" id="readerPane"><article class="reader" id="reader"></article></main>

  <div class="split" id="split" role="separator" aria-orientation="vertical" aria-label="Resize code panel"></div>

  <section class="code" id="code" aria-label="Code editor">
    <div class="code-head">
      <div class="file-tabs" id="fileTabs"></div>
      <span class="spacer"></span>
      <div class="engine-sw" id="engineSw" role="group" aria-label="Where your Java runs">
        <button data-e="browser" title="A real javac compiled to WebAssembly, running in this tab. Works anywhere, including phones. No threads.">In-browser</button>
        <button data-e="local" title="The JDK installed on this computer, through the LLD Lab runner (runner/server.mjs). Needed for threads and Claude reviews.">Your JDK</button>
      </div>
      <button class="tbtn" id="resetCode" title="Replace your code with the starter code">Reset</button>
    </div>
    <div class="editor-wrap" id="editorWrap"></div>
    <div class="vsplit" id="vsplit" role="separator" aria-orientation="horizontal" aria-label="Resize results"></div>
    <div class="results" id="results">
      <div class="res-tabs" role="tablist">
        <button data-rt="tests" class="on">Results</button>
        <button data-rt="review">Claude review</button>
        <span class="spacer"></span>
        <span class="engine-state" id="engineState"></span>
      </div>
      <div class="res-body" id="resBody"></div>
    </div>
    <div class="code-foot">
      <button class="tbtn" id="runBtn" title="Run the visible tests (Ctrl/⌘ + Enter)">Run <span class="k">⌘↵</span></button>
      <button class="tbtn go" id="submitBtn" title="Run every test (Ctrl/⌘ + Shift + Enter)">Submit <span class="k">⇧⌘↵</span></button>
      <button class="tbtn review" id="reviewBtn" title="Ask Claude to review your design">Review with Claude</button>
      <span class="hint" id="codeHint"></span>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
